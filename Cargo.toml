[workspace]
members = [
    "crates/unitedstates",
    "crates/unitedstates-core",
]
default-members = ["crates/unitedstates"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/valkyoth/unitedstates"
repository = "https://github.com/valkyoth/unitedstates"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
panic = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
undocumented_unsafe_blocks = "forbid"
indexing_slicing = "forbid"
arithmetic_side_effects = "forbid"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"

[workspace.dependencies]
unitedstates-core = { path = "crates/unitedstates-core", version = "0.1.0" }

[profile.release]
overflow-checks = true
panic = "abort"
strip = "debuginfo"
